<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZOMBIE SURVIVAL — بقاء الزومبي</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050609;color:#fff;font-family:Tahoma,Arial,sans-serif}
body{touch-action:none}.screen{position:fixed;inset:0}.hidden{display:none!important}
#menu{background:radial-gradient(circle at 70% 25%,#24364a 0,#101722 25%,#050608 68%);overflow:hidden}
#menu:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.66) 37%,rgba(0,0,0,.1) 72%),radial-gradient(circle at 75% 70%,rgba(255,70,15,.22),transparent 35%);pointer-events:none}
.city{position:absolute;inset:20% 0 0;background:linear-gradient(180deg,transparent,#07080a 75%),repeating-linear-gradient(90deg,transparent 0 80px,rgba(100,110,120,.1) 82px 90px);opacity:.8}
.moon{position:absolute;right:25%;top:8%;width:150px;height:150px;border-radius:50%;background:#c8d5df;box-shadow:0 0 45px #9fb7c8;opacity:.75}
.menu-content{position:absolute;left:7%;top:7%;width:min(440px,86vw);text-align:left}
.logo{font-family:Impact,Arial Black,sans-serif;font-size:clamp(60px,8vw,104px);line-height:.8;letter-spacing:2px;color:#eee;text-shadow:5px 6px 0 #111,0 0 20px #000;transform:skew(-5deg)}
.logo b{display:block;color:#e4141b;font-size:.66em;font-style:italic;text-shadow:4px 4px 0 #250000}
.tag{font-size:18px;text-align:center;margin:18px 0 28px;color:#ddd;text-shadow:0 2px 4px #000}
button{font:inherit;color:#fff;cursor:pointer}
.menu-btn{width:100%;height:66px;margin:7px 0;border:1px solid #56606a;border-radius:12px;background:linear-gradient(#30353b,#12161b);box-shadow:0 6px 12px #000,inset 0 0 0 1px #111;font-size:22px;font-weight:bold;text-shadow:0 2px #000;position:relative}
.menu-btn:before{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);opacity:.4}
.menu-btn.primary{background:linear-gradient(#c71b20,#62080c);border:2px solid #ff3b3f;box-shadow:0 0 18px #e20d18,0 6px 15px #000}
.icon{display:inline-block;margin-left:15px;font-size:25px}
.hud-top{position:absolute;top:18px;right:20px;display:flex;gap:12px;z-index:20}
.hud-box{min-width:145px;padding:10px 18px;border:1px solid #48515c;border-radius:12px;background:rgba(8,12,17,.88);box-shadow:0 5px 15px #000;font-weight:bold}
.hud-box span{color:#ffbf24;font-size:20px;margin-left:8px}
#game{background:#111}
#game canvas{display:block;width:100%;height:100%}
.cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none;z-index:5}
.cross:before,.cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px #000}.cross:before{width:2px;height:20px;left:9px}.cross:after{height:2px;width:20px;top:9px}
#gameHud{position:absolute;inset:0;pointer-events:none}
.stats{position:absolute;left:18px;bottom:18px;width:250px}
.bar{height:18px;background:#101217;border:1px solid #66707a;border-radius:8px;margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:#c91d24;width:100%}.bar.ammo i{background:#dcae25}
.weapon{position:absolute;right:22px;bottom:18px;font-size:18px;text-align:right;text-shadow:0 2px 4px #000}.weapon strong{font-size:34px}
#message{position:absolute;left:50%;top:16%;transform:translateX(-50%);padding:12px 24px;background:rgba(0,0,0,.65);border:1px solid #e11;color:#fff;border-radius:8px;font-weight:bold;opacity:0;transition:.25s}
#message.show{opacity:1}
#pause{position:absolute;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:30}
.panel{width:min(420px,88vw);background:linear-gradient(#1e242b,#080b0e);border:1px solid #6d737a;border-radius:16px;padding:28px;text-align:center;box-shadow:0 20px 70px #000}
.panel h2{color:#e21b22;margin-top:0}.panel button{width:100%;padding:14px;margin:6px 0;border-radius:10px;background:#20262c;border:1px solid #667}
.tip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:8px 15px;border-radius:8px;color:#ddd}
#mobile{display:none;position:absolute;inset:0;z-index:10;pointer-events:none}
.stick{position:absolute;bottom:30px;width:130px;height:130px;border:2px solid #ffffff33;border-radius:50%;background:#ffffff08;pointer-events:auto}.stick.left{left:25px}.stick.right{right:25px}
.knob{position:absolute;width:52px;height:52px;left:37px;top:37px;border-radius:50%;background:#ffffff22;border:1px solid #fff5}
@media(max-width:800px){.menu-content{left:5%;top:5%;width:90%;text-align:center}.logo{font-size:64px}.moon{right:5%;width:90px;height:90px}.menu-btn{height:58px}.hud-top{right:8px;top:8px}.hud-box{min-width:105px;padding:7px 10px;font-size:13px}.tip{bottom:175px}.stats{bottom:15px;width:190px}#mobile{display:block}}

/* REAL-GAME UPGRADE */
#game:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 48%,rgba(0,0,0,.62));mix-blend-mode:multiply;z-index:4}
#damage{position:absolute;inset:0;background:rgba(210,0,0,.42);opacity:0;pointer-events:none;z-index:6;transition:opacity .08s}
#hitmarker{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);opacity:0;z-index:7;pointer-events:none}
#hitmarker:before,#hitmarker:after{content:"";position:absolute;inset:16px 0 auto;height:2px;background:#fff;transform:rotate(45deg);box-shadow:0 0 5px #000}.hit2:after{transform:rotate(-45deg)}
#wave{position:absolute;top:92px;left:50%;transform:translateX(-50%);padding:8px 18px;border:1px solid #ffffff44;background:#07090ccc;border-radius:20px;font-weight:bold;z-index:5}
#objective{position:absolute;top:140px;left:50%;transform:translateX(-50%);padding:7px 14px;color:#ddd;background:#0009;border-radius:8px;font-size:13px;z-index:5}
#killfeed{position:absolute;right:20px;top:115px;width:230px;z-index:5;text-align:right}.feed{background:#0009;margin:4px 0;padding:6px 9px;border-right:3px solid #e31b23;font-size:12px;border-radius:4px}
#reload{position:absolute;left:50%;bottom:115px;transform:translateX(-50%);width:210px;height:8px;background:#000b;border:1px solid #888;border-radius:6px;overflow:hidden;display:none;z-index:8}.reloadbar{height:100%;width:0;background:#e2b12a}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle,transparent 52%,rgba(0,0,0,.7));opacity:.55}
.pickup{font-size:22px;color:#ffd33d}
#mobile .mBtn{position:absolute;pointer-events:auto;border:1px solid #fff4;background:#0008;border-radius:50%;width:64px;height:64px;font-size:24px}.mBtn.fire{right:175px;bottom:45px}.mBtn.reload{right:100px;bottom:125px}.mBtn.sprint{right:25px;bottom:45px}
@media(max-width:800px){#wave{top:75px}#objective{top:115px}.tip{display:none}#killfeed{top:105px;width:170px;font-size:10px}.mBtn.fire{right:170px}.weapon{bottom:15px}.stats{bottom:15px}}

</style>
</head>
<body>
<section id="menu" class="screen">
<div class="city"></div><div class="moon"></div>
<div class="hud-top"><div class="hud-box">🪙 <span id="coins">0</span></div><div class="hud-box">⭐ <span id="stars">0</span></div></div>
<div class="menu-content">
<div class="logo">ZOMBIE<b>SURVIVAL</b></div>
<div class="tag">النجاة ليست خياراً.. بل هي الحياة</div>
<button class="menu-btn primary" id="start"><span class="icon">▶</span>ابدأ اللعبة</button>
<button class="menu-btn" id="settings"><span class="icon">⚙</span>الإعدادات</button>
<button class="menu-btn" id="achievements"><span class="icon">♛</span>الإنجازات</button>
<button class="menu-btn" id="instructions"><span class="icon">🎮</span>تعليمات</button>
<div style="margin-top:25px;color:#aaa">v1.0.0 • أول نموذج قابل للعب</div>
</div></section>
<section id="game" class="screen hidden">
<div class="hud-top"><div class="hud-box">🪙 <span id="gcoins">0</span></div><div class="hud-box">⭐ <span id="gstars">0</span></div></div>
<div class="cross"></div><div id="message">اضغط إطلاق</div>
<div id="damage"></div><div id="hitmarker"></div><div id="wave">الموجة 1</div><div id="objective">اقضِ على الزومبي وابقَ حيًا</div><div id="killfeed"></div><div id="reload"><div class="reloadbar"></div></div><div id="vignette"></div><div id="gameHud"><div class="stats">❤️ الصحة <div class="bar"><i id="health"></i></div>🔋 طاقة <div class="bar ammo"><i id="energy"></i></div></div><div class="weapon">السلاح: <b>RIFLE</b><br><strong><span id="ammo">30</span> / ∞</strong></div><div class="tip">WASD للحركة • الفأرة للنظر • انقر للإطلاق • ESC إيقاف</div></div>
<div id="mobile"><div class="stick left"><div class="knob"></div></div><div class="stick right"><div class="knob"></div></div></div>
</section>
<div id="pause" class="hidden"><div class="panel"><h2>اللعبة متوقفة</h2><button id="resume">متابعة</button><button id="back">العودة للقائمة</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {PointerLockControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/PointerLockControls.js';

const $=s=>document.querySelector(s);
const menu=$('#menu'),game=$('#game'),pause=$('#pause');
let coins=0,stars=0,health=100,energy=100,ammo=30,mag=30,wave=1,kills=0,started=false,paused=false,reloading=false,lastShot=0;
const keys={},zombies=[],pickups=[],bullets=[];
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x050a0d); scene.fog=new THREE.FogExp2(0x071014,.026);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,500); camera.position.set(0,1.7,8);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.8)); renderer.shadowMap.enabled=true; renderer.outputColorSpace=THREE.SRGBColorSpace; game.appendChild(renderer.domElement);
const controls=new PointerLockControls(camera,document.body);
const hemi=new THREE.HemisphereLight(0x91a8b9,0x120b08,1.15); scene.add(hemi);
const moon=new THREE.DirectionalLight(0x8da9c2,2.3); moon.position.set(-35,45,15); moon.castShadow=true; scene.add(moon);
const red=new THREE.PointLight(0xff2a12,18,25); red.position.set(5,4,-18); scene.add(red);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x17191a,roughness:1})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

function box(x,y,z,sx,sy,sz,c){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:c,roughness:.9}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
for(let i=0;i<55;i++){const x=(Math.random()-.5)*125,z=-Math.random()*125-5,h=4+Math.random()*20;box(x,h/2,z,3+Math.random()*8,h,3+Math.random()*8,0x20262a)}
for(let i=0;i<30;i++){const x=(Math.random()-.5)*105,z=(Math.random()-.5)*105;box(x,1,z,1+Math.random()*3,2,1+Math.random()*3,0x34312d)}
for(let i=0;i<10;i++){const x=(Math.random()-.5)*70,z=-10-Math.random()*90;const lamp=box(x,5,z,.25,10,.25,0x33383c);const l=new THREE.PointLight(0xffaa55,7,12);l.position.set(x,6,z);scene.add(l)}

function zombie(x,z){const g=new THREE.Group(),skin=new THREE.MeshStandardMaterial({color:0x526c51,roughness:1}),cloth=new THREE.MeshStandardMaterial({color:0x202427});const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,.55),cloth);body.position.y=1.25;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,12,10),skin);head.position.y=2.3;g.add(head);for(const side of [-1,1]){const arm=new THREE.Mesh(new THREE.BoxGeometry(.22,1.35,.22),cloth);arm.position.set(side*.68,1.3,0);arm.rotation.z=-side*.25;g.add(arm);const leg=new THREE.Mesh(new THREE.BoxGeometry(.25,1.1,.25),cloth);leg.position.set(side*.25,.25,0);g.add(leg)}g.position.set(x,0,z);g.userData={hp:2+Math.floor(wave/3),speed:1.1+Math.random()*.7,attack:0,dead:false};scene.add(g);zombies.push(g)}
function spawnWave(){for(let i=0;i<5+wave*3;i++){const a=Math.random()*Math.PI*2,d=25+Math.random()*50;zombie(camera.position.x+Math.cos(a)*d,camera.position.z+Math.sin(a)*d)}$('#wave').textContent='الموجة '+wave+' • '+zombies.length+' زومبي';say('الموجة '+wave+' بدأت')}
function sync(){for(const id of ['coins','gcoins'])$( '#'+id).textContent=coins;for(const id of ['stars','gstars'])$('#'+id).textContent=stars;$('#health').style.width=Math.max(0,health)+'%';$('#energy').style.width=Math.max(0,energy)+'%';$('#ammo').textContent=ammo}
function say(t){const m=$('#message');m.textContent=t;m.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>m.classList.remove('show'),1400)}
function feed(t){const d=document.createElement('div');d.className='feed';d.textContent=t;$('#killfeed').prepend(d);setTimeout(()=>d.remove(),3000)}
function sound(freq,dur,type='square'){try{const A=new AudioContext(),o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+dur);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+dur)}catch{}}
function flashHit(){const h=$('#hitmarker');h.style.opacity=1;setTimeout(()=>h.style.opacity=0,90)}
function damage(n){health-=n;$('#damage').style.opacity=.8;setTimeout(()=>$('#damage').style.opacity=0,90);sound(90,.08,'sawtooth');if(health<=0){health=100;energy=100;ammo=mag;camera.position.set(0,1.7,8);coins=Math.max(0,coins-25);say('تم إسقاطك! -25 عملة');wave=Math.max(1,wave-1)}sync()}
function shoot(){if(reloading||performance.now()-lastShot<150)return;if(ammo<=0){reload();return}lastShot=performance.now();ammo--;sync();sound(180,.045);const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hit=ray.intersectObjects(zombies,true)[0];if(hit){let z=hit.object;while(z.parent&&!zombies.includes(z))z=z.parent;if(zombies.includes(z)){z.userData.hp--;flashHit();if(z.userData.hp<=0){scene.remove(z);zombies.splice(zombies.indexOf(z),1);kills++;coins+=10;stars++;feed('☠️ زومبي سقط • +10');sound(55,.12,'sawtooth');if(kills%5===0){energy=100;ammo=Math.min(mag,ammo+10);say('ذخيرة ومكافأة!')} }}}}
function reload(){if(reloading||ammo===mag)return;reloading=true;$('#reload').style.display='block';const bar=$('.reloadbar');let t=0;const timer=setInterval(()=>{t+=50;bar.style.width=(t/1500*100)+'%';if(t>=1500){clearInterval(timer);ammo=mag;reloading=false;bar.style.width=0;$('#reload').style.display='none';sound(520,.08);sync()}},50)}
function move(dt){if(!controls.isLocked||paused)return;let speed=8;if(keys.ShiftLeft&&energy>0){speed=13;energy=Math.max(0,energy-25*dt)}else energy=Math.min(100,energy+12*dt);if(keys.KeyW)controls.moveForward(speed*dt);if(keys.KeyS)controls.moveForward(-speed*dt);if(keys.KeyA)controls.moveRight(-speed*dt);if(keys.KeyD)controls.moveRight(speed*dt);camera.position.y=1.7;camera.position.x=Math.max(-65,Math.min(65,camera.position.x));camera.position.z=Math.max(-130,Math.min(15,camera.position.z))}
function updateZombies(dt){for(const z of [...zombies]){const d=z.position.distanceTo(camera.position);if(d<55){z.lookAt(camera.position.x,0,camera.position.z);if(d>1.8)z.translateZ(z.userData.speed*dt);else{z.userData.attack-=dt;if(z.userData.attack<=0){z.userData.attack=.65;damage(5)}}}}if(zombies.length===0&&started&&!paused){wave++;spawnWave()}}
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload();if(e.code==='Escape'&&started){paused=true;pause.classList.remove('hidden');controls.unlock()}});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousedown',()=>{if(started&&!paused){if(!controls.isLocked)controls.lock();else shoot()}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
$('#start').onclick=()=>{try{started=true;menu.classList.add('hidden');game.classList.remove('hidden');health=100;energy=100;ammo=mag;wave=1;kills=0;zombies.splice(0);spawnWave();sync();say('اللعبة بدأت — اضغط داخل الشاشة للبدء');}catch(err){started=false;menu.classList.remove('hidden');game.classList.add('hidden');alert('تعذر تشغيل اللعبة: '+err.message)}};
game.addEventListener('click',()=>{if(started&&!paused&&!controls.isLocked)controls.lock()});
window.addEventListener('error',e=>{if(started)alert('خطأ في اللعبة: '+e.message)});
$('#resume').onclick=()=>{paused=false;pause.classList.add('hidden');setTimeout(()=>controls.lock(),50)};
$('#back').onclick=()=>{paused=false;started=false;pause.classList.add('hidden');game.classList.add('hidden');menu.classList.remove('hidden');controls.unlock()};
$('#settings').onclick=()=>alert('الإعدادات جاهزة لاحقاً: الصوت، الحساسية، الجودة.');
$('#achievements').onclick=()=>alert('🏆 الإنجازات\n\nأول قتيل • صياد الليل • الناجي • موجة 10');
$('#instructions').onclick=()=>alert('🎮 WASD حركة • Shift ركض • الفأرة تصويب/إطلاق • R إعادة تلقيم • ESC إيقاف');
const fire=document.createElement('button');fire.className='mBtn fire';fire.textContent='🔫';fire.type='button';$('#mobile').appendChild(fire);fire.addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
const rb=document.createElement('button');rb.className='mBtn reload';rb.textContent='↻';rb.type='button';$('#mobile').appendChild(rb);rb.addEventListener('pointerdown',e=>{e.preventDefault();reload()});
const sb=document.createElement('button');sb.className='mBtn sprint';sb.textContent='⚡';sb.type='button';$('#mobile').appendChild(sb);sb.addEventListener('pointerdown',e=>{keys.ShiftLeft=true});sb.addEventListener('pointerup',()=>keys.ShiftLeft=false);sb.addEventListener('pointercancel',()=>keys.ShiftLeft=false);
const left=$('.stick.left'),knob=left.querySelector('.knob');let drag=false;left.addEventListener('pointerdown',e=>{drag=true;left.setPointerCapture(e.pointerId)});left.addEventListener('pointerup',()=>{drag=false;knob.style.transform='translate(0,0)';keys.KeyW=keys.KeyS=keys.KeyA=keys.KeyD=false});left.addEventListener('pointermove',e=>{if(!drag)return;const r=left.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),mx=Math.max(-40,Math.min(40,x)),my=Math.max(-40,Math.min(40,y));knob.style.transform='translate('+mx+'px,'+my+'px)';keys.KeyA=mx<-15;keys.KeyD=mx>15;keys.KeyW=my<-15;keys.KeyS=my>15});
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;move(dt);updateZombies(dt);$('#wave').textContent='الموجة '+wave+' • '+zombies.length+' زومبي';sync();renderer.render(scene,camera)}loop(performance.now());renderer.setSize(innerWidth,innerHeight);
</script>
</body></html>
